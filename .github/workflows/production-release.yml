name: Production Release

on:
  schedule:
    # Nightly release window: 17:00 Manila / 09:00 UTC — end of business day.
    # Sole deploy path to production (Vercel git integration is disconnected);
    # pushes to main accumulate during the day and ship once nightly.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      force:
        description: "Release even if no new commits since last tag"
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  # ─────────────────────────────────────────────
  # 0. CHANGE GUARD (nightly cron no-ops on quiet days)
  # ─────────────────────────────────────────────
  changes:
    name: check-new-commits
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Skip if no commits since last release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "[INFO] Manual force requested"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git tag --sort=-v:refname | head -1 2>/dev/null || echo "")
          fi

          if [ -z "$LATEST_TAG" ]; then
            echo "[INFO] No previous release — releasing initial version"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_SHA=$(git rev-list -n 1 "${LATEST_TAG}" 2>/dev/null || echo "")
          HEAD_SHA=$(git rev-parse HEAD)

          if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
            echo "[SKIP] HEAD ${HEAD_SHA:0:7} is already released as ${LATEST_TAG}"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "[OK] New commits since ${LATEST_TAG} (${TAG_SHA:0:7}..${HEAD_SHA:0:7})"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────
  # 1. VALIDATE
  # ─────────────────────────────────────────────
  validate:
    name: validate
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

  # ─────────────────────────────────────────────
  # 2. DEPLOY TO VERCEL
  # ─────────────────────────────────────────────
  deploy:
    name: deploy-production
    runs-on: ubuntu-latest
    needs: [validate]
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: Deploy to production
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to: ${URL}"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # 3. SMOKE TESTS
  # ─────────────────────────────────────────────
  smoke-tests:
    name: smoke-tests
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check health endpoint
        run: |
          URL="${{ secrets.PRODUCTION_APP_URL }}"
          if [ -z "$URL" ]; then
            echo "[SKIP] PRODUCTION_APP_URL not configured"
            exit 0
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/api/health" --max-time 15)
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "[OK] Health endpoint: HTTP ${HTTP_STATUS}"
          else
            echo "[WARN] Health endpoint: HTTP ${HTTP_STATUS}"
          fi

      - name: Check login page
        run: |
          URL="${{ secrets.PRODUCTION_APP_URL }}"
          if [ -z "$URL" ]; then
            echo "[SKIP] PRODUCTION_APP_URL not configured"
            exit 0
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/login" --max-time 15)
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ] || [ "$HTTP_STATUS" = "307" ]; then
            echo "[OK] Login page: HTTP ${HTTP_STATUS}"
          else
            echo "[FAIL] Login page: HTTP ${HTTP_STATUS}"
            exit 1
          fi

  # ─────────────────────────────────────────────
  # 4. CREATE GITHUB RELEASE
  # ─────────────────────────────────────────────
  release:
    name: create-release
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: success()
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version bump
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get latest release tag — try multiple methods
          LATEST_TAG=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || echo "")
          
          # Fallback: check git tags
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git tag --sort=-v:refname | head -1 2>/dev/null || echo "")
          fi
          
          # Final fallback
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          
          echo "Latest tag: ${LATEST_TAG}"

          # Strip 'v' prefix and split
          VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          # Ensure we have valid numbers
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          # Determine bump type from input or commit messages
          BUMP="${{ github.event.inputs.version_bump }}"
          if [ -z "$BUMP" ]; then
            # Auto-detect from commit messages since last release
            COMMITS=$(git log ${LATEST_TAG}..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s" -20)
            if echo "$COMMITS" | grep -qiE "^BREAKING|^feat!"; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qiE "^feat"; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          fi

          # Bump version
          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          
          # Check if tag already exists, increment if needed
          while git rev-parse "$NEW_TAG" >/dev/null 2>&1; do
            echo "Tag ${NEW_TAG} already exists, incrementing patch..."
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          done

          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "bump_type=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "New version: ${NEW_TAG} (${BUMP} bump)"

      - name: Generate release notes
        id: notes
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          bash .github/scripts/generate-release-notes.sh \
            "${NEW_TAG}" \
            "${{ steps.version.outputs.latest_tag }}" > /tmp/release-body.md

          echo "body_path=/tmp/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          
          # Create the tag first
          git tag "${NEW_TAG}"
          git push origin "${NEW_TAG}"
          
          # Then create the release
          gh release create "${NEW_TAG}" \
            --title "${NEW_TAG}" \
            --notes-file /tmp/release-body.md \
            --target main
